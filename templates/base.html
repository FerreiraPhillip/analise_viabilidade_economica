<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Análise de Viabilidade Econômica{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('homepage') }}">Viabilidade Econômica</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('analise_manual') }}">Inserção manual</a>
        <a class="nav-link" href="{{ url_for('importar_planilha') }}">Importar planilha</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-warning">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
